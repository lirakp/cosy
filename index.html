<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Cosy</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <div id="stage">
      <canvas id="game" width="320" height="180" aria-label="Cosy – ein gemütliches Pixel-Art-Spiel"></canvas>
      <div id="hud">
        <div id="gold" title="Gold">◉ <span>0</span></div>
        <button id="btn-gallery">Galerie <kbd>G</kbd></button>
      </div>
      <button id="btn-well" hidden>✦ Wunschbrunnen <kbd>E</kbd></button>
    </div>
    <p class="hint">← → oder A / D laufen · Münzen einsammeln · am Brunnen wünschen</p>
  </main>
  <div id="overlay" hidden></div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
