<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Cosy</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <div id="stage">
      <canvas id="game" width="320" height="180" aria-label="Cosy – ein gemütliches Pixel-Art-Spiel"></canvas>
      <div id="hud">
        <div class="hud-left">
          <div id="gold" title="Gold">◉ <span>0</span></div>
          <button id="btn-pause" title="Pause (P)" aria-label="Pause">❚❚</button>
          <button id="btn-sound" aria-label="Ton ausschalten">♪</button>
          <div id="daytime" title="Tageszeit"></div>
        </div>
        <div class="hud-buttons">
          <button id="btn-arena">Arena <kbd>B</kbd></button>
          <button id="btn-dungeon">Dungeon <kbd>F</kbd></button>
          <button id="btn-expedition">Expedition <kbd>X</kbd></button>
          <button id="btn-gallery">Galerie <kbd>G</kbd></button>
        </div>
      </div>
      <div id="toast" hidden></div>
      <button id="btn-action" hidden><span></span> <kbd>E</kbd></button>
    </div>
    <p class="hint">← → oder A / D laufen · Münzen sammeln · am Brunnen wünschen · im Lager die Truhe leeren · links der Dungeon · rechts die Bossarena</p>
  </main>
  <div id="overlay" hidden></div>
  <div id="pause" hidden>
    <div class="pause-card">
      <h2>PAUSE</h2>
      <p>Die Welt steht still. Expedition und Dungeon laufen weiter.</p>
      <div class="sound-settings">
        <label>Musik <input type="range" id="vol-music" min="0" max="100" step="5"></label>
        <label>Effekte <input type="range" id="vol-sfx" min="0" max="100" step="5"></label>
        <p class="muted">Ton an/aus: Knopf ♪ oder Taste <kbd>M</kbd></p>
      </div>
      <button class="big" id="btn-resume">Weiter <kbd>P</kbd></button>
    </div>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
