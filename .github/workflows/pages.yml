name: Web-App veröffentlichen

# Stellt das Spiel auf GitHub Pages bereit. Von dort lässt es sich auf jedem Handy
# (auch iPhone) im Browser spielen und „Zum Home-Bildschirm“ hinzufügen.
on:
  push:
    branches: [main, claude/cozy-game-foundation-nhof2p]
    paths-ignore: ['README.md']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Spieldateien sammeln
        run: |
          mkdir -p site
          cp -r index.html style.css manifest.webmanifest sw.js icons src site/
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
